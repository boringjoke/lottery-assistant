server {
    listen 80 default_server;
    server_name _;

    client_max_body_size 2m;

    # 当前彩票项目没有绑定域名，挂载在 /lottery-assistant/ 子路径。
    # 访问方式：http://服务器公网IP/lottery-assistant/
    location = / {
        return 302 /lottery-assistant/;
    }

    location = /lottery-assistant {
        return 301 /lottery-assistant/$is_args$args;
    }

    location /lottery-assistant/ {
        proxy_pass http://lottery-frontend:80/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 后续只能 IP 访问的新项目可以放在独立路径下。
    # 注意：对应前端最好支持子路径部署，否则静态资源可能仍从 /assets 加载并产生冲突。
    #
    # location /tool-a/ {
    #     proxy_pass http://tool-a-frontend:80/;
    #     proxy_http_version 1.1;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }
}
